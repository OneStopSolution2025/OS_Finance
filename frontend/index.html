<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Udhayam MFI</title>
<meta name="theme-color" content="#183B66">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{
    /* Udhayam MFI brand palette — variable names kept as-is (amber/charcoal/lime)
       to avoid a risky find-replace across the whole file; only the VALUES changed. */
    --ink:#1B1B1B;
    --amber:#64A844;      /* was gold #FFB600 — now Udhayam green, primary accent/CTA */
    --charcoal:#183B66;   /* was dark charcoal #231F20 — now Udhayam navy, sidebar/dark surfaces */
    --lime:#8BC34A;       /* lighter green, used for gradient accents alongside --amber */
    --trust:#183B66;
    --trust-dark:#0F2847;
    --surface:#FFFFFF;
    --bg:#F5F7F6;
    --border:#DCE3E0;
    --danger:#C0392B;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
  h1,h2,h3{font-family:'Archivo Black','Space Grotesk',sans-serif;letter-spacing:-0.01em;margin:0;font-weight:400}
  .app{display:none;min-height:100vh}
  .app.active{display:flex;height:100vh;overflow:hidden}
  /* ---- Login ---- */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--charcoal) 0%,#100D0C 100%);padding:20px;position:relative;overflow:hidden}
  #login-screen::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,182,0,.08) 1.5px,transparent 1.5px);background-size:28px 28px;pointer-events:none}
  #login-screen::after{content:'';position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,182,0,.15) 0%,transparent 70%);top:-120px;right:-120px;pointer-events:none}
  .login-card{background:var(--surface);border-radius:20px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 24px 70px rgba(0,0,0,.4);position:relative;z-index:1;border-top:4px solid var(--amber)}
  .login-card .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
  .brand-mark{width:38px;height:38px;border-radius:8px;background:var(--amber);display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:400;font-family:'Archivo Black',sans-serif;box-shadow:0 2px 8px rgba(255,182,0,.35)}
  .brand-name{font-size:19px;font-weight:700;font-family:'Archivo Black',sans-serif;letter-spacing:-0.01em}
  .login-card label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:#555}
  .login-card input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
  .login-card input:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber)}
  .btn{background:var(--amber);color:var(--ink);border:none;padding:12px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .btn:hover{background:#E6A500}
  .btn.amber{background:var(--amber);color:var(--ink)}
  .btn.amber:hover{background:#548F38}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-block{width:100%;margin-top:22px;padding:13px}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px}
  /* ---- Shell ---- */
  .sidebar{width:230px;background:var(--charcoal);color:#EFEAE0;flex-shrink:0;display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
  .sidebar .brand-name{color:#fff;font-size:16px}
  .role-pill{font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:var(--amber);color:var(--ink);padding:3px 9px;border-radius:20px;display:inline-block;margin-top:4px;font-weight:700;box-shadow:0 1px 4px rgba(255,182,0,.4)}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:#D8D3C8;margin-bottom:2px;transition:background .12s,transform .1s}
  .nav-item:hover{transform:translateX(2px)}
  .nav-item:hover{background:rgba(255,255,255,.06)}
  .nav-item.active{background:var(--amber);color:var(--ink);font-weight:600;box-shadow:0 2px 8px rgba(255,182,0,.3)}
  .sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:#fff;border-bottom:2px solid var(--amber);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
  .topbar h2{font-size:20px}
  .content{padding:24px;flex:1;overflow-y:auto}
  .mobile-topbar{display:none}
  /* ---- Cards / grids ---- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--amber),var(--lime))}
  .stat-card.clickable{cursor:pointer;transition:transform .12s,box-shadow .12s}
  .stat-card.clickable:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08);border-color:var(--amber)}
  .stat-card .label{font-size:12px;color:#777;text-transform:uppercase;letter-spacing:.04em}
  .stat-card .value{font-size:26px;font-weight:700;margin-top:6px;color:var(--trust)}
  .panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .panel table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-scroll-hint{font-size:11px;color:#999;text-align:center;padding:6px 0 0;font-style:italic}
  .panel h3{position:relative;padding-left:12px}
  .panel h3::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:3px;background:var(--amber);border-radius:2px}
  .panel h3{font-size:16px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;padding:10px 8px;border-bottom:2px solid var(--border);color:#666;font-weight:600;font-size:12px;text-transform:uppercase}
  td{padding:10px 8px;border-bottom:1px solid var(--border)}
  tr:hover td{background:#FAFAF8}
  .badge{padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .badge.active,.badge.approved,.badge.disbursed,.badge.present{background:#EEF5C4;color:#5A6B00}
  .badge.pending_approval,.badge.trial{background:#FFF3D6;color:#8A6200}
  .badge.suspended,.badge.rejected,.badge.overdue{background:#FBE4E1;color:var(--danger)}
  .badge.closed{background:#E7E3DC;color:#555}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .field label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:5px}
  .field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px}
  .row-actions{display:flex;gap:8px;margin-top:16px}
  .empty{color:#999;font-size:13.5px;padding:32px 24px;text-align:center;line-height:1.6}
  .hidden{display:none !important}
  .menu-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer}
  @media(max-width:860px){
    .sidebar{position:fixed;left:-240px;top:0;bottom:0;z-index:20;transition:left .2s;box-shadow:2px 0 20px rgba(0,0,0,.2)}
    .sidebar.open{left:0}
    .menu-toggle{display:block}
    .content{padding:16px}
    .topbar{padding:12px 16px}
    .login-card{padding:30px 24px}
  }
    label.pw-label{display:flex;justify-content:space-between;align-items:center}
    .pw-wrap{position:relative}
    .pw-wrap input{padding-right:40px}
    .pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:2px;color:#888}
    .link-btn{background:none;border:none;color:var(--trust);font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline}
    .forgot-link{text-align:right;margin-top:6px}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.show{display:flex}
    .modal-card{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:440px}
    .modal-card h3{font-size:19px;margin-bottom:6px;font-family:'Archivo Black','Space Grotesk',sans-serif;letter-spacing:-0.01em;font-weight:400}
    .modal-card p.sub{font-size:12.5px;color:#666;margin:0 0 20px;line-height:1.55}
    .modal-card label{display:block;font-size:12.5px;font-weight:600;margin:14px 0 6px;color:#555;text-transform:uppercase;letter-spacing:.03em}
    .modal-card label:first-of-type{margin-top:0}
    .modal-card input,.modal-card select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;display:block;box-sizing:border-box}
    .modal-card input:focus,.modal-card select:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber)}
    .modal-card select{appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8"><path d="M1 1l5 5 5-5" stroke="%23888" stroke-width="1.5" fill="none"/></svg>');background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
    .modal-card .row-actions{margin-top:22px}
    .modal-card .pw-wrap input{padding-right:40px}
    .success-box{background:#EEF5C4;border:1px solid #D9E89A;border-radius:8px;padding:12px;font-size:12.5px;color:#5A6B00;margin-top:12px;word-break:break-all}
    /* ---- Smart Garage style dashboard cards ---- */
    .trend-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
    .trend-bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:16px}
    .trend-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
    .trend-bar{width:100%;background:var(--amber);border-radius:4px 4px 0 0;min-height:3px;transition:height .3s}
    .trend-bar-label{font-size:10px;color:#888;margin-top:6px}
    .trend-bar-value{font-size:10px;color:var(--trust);font-weight:700;margin-bottom:4px}
    .activity-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:760px){.activity-grid{grid-template-columns:1fr}}
    .activity-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
    .activity-item:last-child{border-bottom:none}
    .activity-main{font-weight:600}
    .activity-sub{color:#888;font-size:11.5px}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
  .overlay.show{display:block}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="brand" style="justify-content:center;margin-bottom:8px">
      <img src="logo-horizontal.png" alt="Udhayam Micro Finance Institutions" style="max-width:260px;width:100%;height:auto">
    </div>
    <label>Email</label>
    <input id="login-email" type="email" placeholder="you@company.com" autocomplete="username">
    <label class="pw-label">Password</label>
    <div class="pw-wrap">
      <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password">
      <button type="button" class="pw-toggle" onclick="togglePw('login-password', this)">👁</button>
    </div>
    <div class="forgot-link"><button class="link-btn" onclick="openForgotModal()">Forgot password?</button></div>
    <button class="btn btn-block" onclick="doLogin()">Sign in</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div class="modal-overlay" id="forgot-modal">
  <div class="modal-card">
    <div id="forgot-step-request">
      <h3>Reset your password</h3>
      <p class="sub">Enter the email on your OS Finances account.</p>
      <label>Email</label>
      <input id="forgot-email" type="email" placeholder="you@company.com">
      <div class="row-actions">
        <button class="btn amber" onclick="requestPasswordReset()">Send reset link</button>
        <button class="btn ghost" onclick="closeForgotModal()">Cancel</button>
      </div>
      <div class="err" id="forgot-err"></div>
      <div id="forgot-result"></div>
    </div>
    <div id="forgot-step-reset" class="hidden">
      <h3>Set a new password</h3>
      <p class="sub">Paste the reset code you were given, and choose a new password.</p>
      <label>Reset code</label>
      <input id="reset-token" type="text" placeholder="Reset code">
      <label class="pw-label">New password</label>
      <div class="pw-wrap">
        <input id="reset-password" type="password" placeholder="At least 8 characters">
        <button type="button" class="pw-toggle" onclick="togglePw('reset-password', this)">👁</button>
      </div>
      <div class="row-actions">
        <button class="btn amber" onclick="submitPasswordReset()">Update password</button>
        <button class="btn ghost" onclick="closeForgotModal()">Cancel</button>
      </div>
      <div class="err" id="reset-err"></div>
      <div id="reset-result"></div>
    </div>
  </div>
</div>

<!-- APP SHELL -->
<div class="app" id="app">
  <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <img src="logo-icon.png" alt="Udhayam" class="brand-mark" style="background:#fff;padding:4px;object-fit:contain">
      <div>
        <div class="brand-name">Udhayam MFI</div>
        <div class="role-pill" id="role-pill">—</div>
      </div>
    </div>
    <div id="nav-items"></div>
    <div class="sidebar-footer">
      <div style="font-size:13px;color:#D8D3C8" id="user-name">—</div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu-toggle" onclick="toggleSidebar(true)">☰</button>
        <h2 id="page-title">Dashboard</h2>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span id="topbar-user-name" style="font-size:13px;color:#555;display:none"></span>
        <button id="install-app-btn" class="btn amber hidden" style="padding:8px 14px;font-size:13px" onclick="installApp()">⬇ Install App</button>
        <button class="btn ghost" style="padding:8px 14px;font-size:13px" onclick="logout()">Sign out</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
const API = window.OSF_API_BASE || localStorage.getItem('osf_api_base') || 'http://localhost:8000';
let state = { token:null, role:null, name:null, tenant_id:null, branch_id:null, view:'dashboard' };

// ---------- Show/hide password ----------
// ---------- Input validation helpers ----------
function digitsOnly(el, maxLen){
  el.value = el.value.replace(/\D/g, '').slice(0, maxLen);
}
function isValidPhone(v){ return /^\d{10}$/.test(v); }
function isValidAadhaar(v){ return /^\d{12}$/.test(v); }
function isValidPan(v){ return /^[A-Z]{5}[0-9]{4}[A-Z]$/.test(v); }
function panOnly(el){
  el.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10);
}
function onPhotoIdTypeChange(){
  const type = document.getElementById('e-photo-id-type').value;
  const input = document.getElementById('e-photo-id-number');
  input.value = '';
  if(type === 'aadhaar'){
    input.setAttribute('inputmode', 'numeric'); input.setAttribute('maxlength', '12');
    input.placeholder = '12-digit Aadhaar number';
    input.oninput = () => digitsOnly(input, 12);
  } else {
    input.removeAttribute('inputmode'); input.removeAttribute('maxlength');
    input.placeholder = ''; input.oninput = null;
  }
}

function togglePw(id, btn){
  const input = document.getElementById(id);
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.textContent = showing ? '👁' : '🙈';
}

// ---------- Forgot password ----------
function openForgotModal(){
  document.getElementById('forgot-modal').classList.add('show');
  document.getElementById('forgot-step-request').classList.remove('hidden');
  document.getElementById('forgot-step-reset').classList.add('hidden');
  document.getElementById('forgot-err').textContent = '';
  document.getElementById('forgot-result').innerHTML = '';
}
function closeForgotModal(){ document.getElementById('forgot-modal').classList.remove('show'); }
async function requestPasswordReset(){
  const email = document.getElementById('forgot-email').value.trim();
  const errEl = document.getElementById('forgot-err'); errEl.textContent = '';
  if(!email){ errEl.textContent = 'Enter your email.'; return; }
  try{
    const res = await fetch(API + '/auth/forgot-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || 'Something went wrong.');
    let html = `<p style="font-size:12.5px;color:#555;margin-top:10px">${data.message}</p>`;
    if(data.dev_reset_token){
      html += `<div class="success-box">Reset code (valid ${data.expires_in_minutes} min): <strong>${data.dev_reset_token}</strong><br><span style="font-weight:400">Email delivery isn't connected yet — for now, copy this code and use it below.</span></div>`;
    }
    document.getElementById('forgot-result').innerHTML = html;
    document.getElementById('forgot-step-request').classList.add('hidden');
    document.getElementById('forgot-step-reset').classList.remove('hidden');
    if(data.dev_reset_token) document.getElementById('reset-token').value = data.dev_reset_token;
  }catch(e){ errEl.textContent = e.message; }
}
async function submitPasswordReset(){
  const token = document.getElementById('reset-token').value.trim();
  const newPassword = document.getElementById('reset-password').value;
  const errEl = document.getElementById('reset-err'); errEl.textContent = '';
  if(!token || !newPassword){ errEl.textContent = 'Enter the reset code and a new password.'; return; }
  try{
    const res = await fetch(API + '/auth/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({token, new_password:newPassword}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || 'Something went wrong.');
    document.getElementById('reset-result').innerHTML = `<div class="success-box">${data.message}</div>`;
    setTimeout(closeForgotModal, 1800);
  }catch(e){ errEl.textContent = e.message; }
}

// ---------- API helper ----------
async function api(path, opts={}){
  const headers = opts.headers || {};
  if(state.token) headers['Authorization'] = 'Bearer ' + state.token;
  if(opts.json){ headers['Content-Type']='application/json'; opts.body = JSON.stringify(opts.json); }
  const res = await fetch(API + path, { ...opts, headers });
  if(res.status === 401){ logout(); throw new Error('Session expired'); }
  let data;
  try{ data = await res.json(); }catch(e){ data = null; }
  if(!res.ok) throw new Error((data && data.detail) || 'Request failed');
  return data;
}

// ---------- Auth ----------
async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Enter email and password.'; return; }
  try{
    const body = new URLSearchParams({ username: email, password });
    const res = await fetch(API + '/auth/login', { method:'POST', body });
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || 'Login failed');
    state.token = data.access_token;
    state.role = data.role;
    state.name = data.full_name;
    state.tenant_id = data.tenant_id;
    state.branch_id = data.branch_id;
    sessionStorage.setItem('osf_session', JSON.stringify(state));
    enterApp();
  }catch(e){
    errEl.textContent = e.message;
  }
}
function logout(){
  state = { token:null, role:null, name:null, tenant_id:null, branch_id:null, view:'dashboard' };
  sessionStorage.removeItem('osf_session');
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-screen').style.display = 'flex';
}

// ---------- Nav per role ----------
const NAV = {
  superadmin: [
    {id:'dashboard', label:'📊 Overview'},
    {id:'branches', label:'🏬 Branches'},
    {id:'employees', label:'👥 Employees'},
    {id:'loan-products', label:'📄 Loan Products'},
    {id:'loans', label:'💰 Loans'},
    {id:'reports', label:'📈 Reports'},
    {id:'payment-settings', label:'🔑 Payment Settings'},
  ],
  employee: [
    {id:'dashboard', label:'📊 Overview'},
    {id:'customers', label:'🧑‍🤝‍🧑 Customers'},
    {id:'loans', label:'💰 Loans'},
    {id:'collections', label:'💵 Collections'},
  ],
};

function enterApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('role-pill').textContent = state.role.replace('superadmin','Super Admin').replace('employee','Employee');
  document.getElementById('user-name').textContent = state.name || '';
  renderNav();
  navigate('dashboard');
}
function renderNav(){
  const nav = NAV[state.role] || [];
  document.getElementById('nav-items').innerHTML = nav.map(n =>

const content = () => document.getElementById('content');
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Adds a "scroll for more" hint under any table that's genuinely wider than its
// container — only shows when actually needed, works for every table in the
// app automatically since it watches #content for changes rather than requiring
// each page's render function to remember to call it.
function addScrollHints(){
  document.querySelectorAll('.panel table').forEach(table => {
    const existingHint = table.nextElementSibling;
    const isHint = existingHint && existingHint.classList && existingHint.classList.contains('table-scroll-hint');
    if(table.scrollWidth > table.clientWidth + 2){
      if(!isHint){
        const hint = document.createElement('div');
        hint.className = 'table-scroll-hint';
        hint.textContent = '↔ Swipe to see more columns';
        table.insertAdjacentElement('afterend', hint);
      }
    } else if(isHint){
      existingHint.remove();
    }
  });
}
new MutationObserver(() => {
  clearTimeout(window._scrollHintTimer);
  window._scrollHintTimer = setTimeout(addScrollHints, 80);
}).observe(document.getElementById('content'), { childList: true, subtree: true });

// ---------- Dashboard (Smart Garage style: stats + growth trend + recent activity) ----------
function renderTrendBars(trend, valueKey, labelPrefix){
  const max = Math.max(1, ...trend.map(d => d[valueKey]));
  return `<div class="trend-bars">${trend.map(d => {
    const h = Math.max(3, Math.round((d[valueKey] / max) * 100));
    const label = new Date(d.date).toLocaleDateString(undefined, {weekday:'short'});
    return `<div class="trend-bar-col">
      <div class="trend-bar-value">${labelPrefix}${d[valueKey].toLocaleString()}</div>
      <div class="trend-bar" style="height:${h}px"></div>
      <div class="trend-bar-label">${label}</div>
    </div>`;
  }).join('')}</div>`;
}

  const fileInput = document.getElementById('e-address-proof-file');
  const statusEl = document.getElementById('e-address-proof-status');
  if(!fileInput.files.length){ statusEl.textContent = 'Choose a file first'; statusEl.style.color = '#C0392B'; return; }
  const formData = new FormData();
  formData.append('doc_type', 'address_proof');
  formData.append('employee_id', employeeId);
  formData.append('file', fileInput.files[0]);
  try{
    const res = await fetch(API + '/documents/upload', { method:'POST', headers:{'Authorization':`Bearer ${state.token}`}, body: formData });

function toggleOtherInterestFields(prefix){

  document.getElementById(fieldsId).classList.toggle('hidden', !isOther);
}
function toggleGroupFields(){
  document.getElementById('lp-group-fields').classList.toggle('hidden', !document.getElementById('lp-is-group').checked);
}
function togglePenaltyAmountHint(){
  const type = document.getElementById('lp-penalty-type').value;
  const hints = { flat: 'A one-time flat amount, charged once regardless of how late.', percentage: 'A % of the member\'s installment share, charged once.', per_day: 'Charged for every day late — e.g. ₹10/day × 5 days late = ₹50.' };
  document.getElementById('lp-penalty-hint').textContent = hints[type] || '';
}
function interestTypeLabel(p){
  if(p.interest_type === 'other') return `${esc(p.custom_interest_label || 'Custom')} (${p.calculation_basis})`;
  return p.interest_type === 'reducing' ? 'Reducing balance' : 'Flat';
}
function productRow(p){
  return `<tr>
    <td>${esc(p.name)}</td><td>${interestTypeLabel(p)}</td><td>${p.interest_rate_annual}%</td><td>₹${p.min_amount}–₹${p.max_amount}</td><td>${p.tenure_months} mo</td>
    <td>${p.is_group_loan ? `👥 ${p.group_member_count||'?'}` : '—'}</td>
    <td><span class="badge ${p.is_active?'active':'suspended'}">${p.is_active?'Active':'Inactive'}</span></td>

        ? `<button class="btn ghost" style="padding:6px 8px;font-size:12px" onclick="deactivateProduct('${p.id}')">Deactivate</button>`
        : `<button class="btn amber" style="padding:6px 8px;font-size:12px" onclick="activateProduct('${p.id}')">Activate</button>`}
      <button class="btn ghost" style="padding:6px 8px;font-size:12px;color:#C0392B" onclick="deleteProduct('${p.id}')">Delete</button>
    </td>
  </tr>`;
}
async function refreshProductsTable(){
  const products = await api('/loan-products?include_inactive=true');
  document.getElementById('products-tbody').innerHTML = products.map(p=>productRow(p)).join('') || '<tr><td colspan="7" class="empty">No loan products yet</td></tr>';
}
let editingProductId = null;
function openEditProduct(p){
  editingProductId = p.id;
  document.getElementById('ep-name').value = p.name;
  document.getElementById('ep-type').value = p.interest_type;
  document.getElementById('ep-rate').value = p.interest_rate_annual;
  document.getElementById('ep-custom-label').value = p.custom_interest_label || '';
  document.getElementById('ep-calc-basis').value = p.calculation_basis || 'flat';
  toggleOtherInterestFields('ep');
  document.getElementById('ep-err').textContent = '';
  document.getElementById('edit-product-modal').classList.add('show');
}
async function submitEditProduct(){
  const errEl = document.getElementById('ep-err');
  const interestType = document.getElementById('ep-type').value;
  const payload = {
    name: document.getElementById('ep-name').value,
    interest_type: interestType,
    interest_rate_annual: Number(document.getElementById('ep-rate').value),
  };
  if(interestType === 'other'){
    payload.custom_interest_label = document.getElementById('ep-custom-label').value;
    payload.calculation_basis = document.getElementById('ep-calc-basis').value;
  }
  try{
    await api(`/loan-products/${editingProductId}`, { method:'PATCH', json: payload });
    document.getElementById('edit-product-modal').classList.remove('show');
    refreshProductsTable();
  }catch(e){ errEl.textContent = e.message; }
}
async function activateProduct(id){ await api(`/loan-products/${id}/activate`, {method:'PATCH'}); refreshProductsTable(); }
async function deactivateProduct(id){ await api(`/loan-products/${id}/deactivate`, {method:'PATCH'}); refreshProductsTable(); }
async function deleteProduct(id){
  if(!confirm('Delete this loan product? This cannot be undone.')) return;
  try{
    await api(`/loan-products/${id}`, {method:'DELETE'});
    refreshProductsTable();
  }catch(e){ alert(e.message); }
}
async function createLoanProduct(){
  const errEl = document.getElementById('lp-err');
  const interestType = document.getElementById('lp-type').value;
  const payload = {
    name: document.getElementById('lp-name').value, interest_type: interestType,
    interest_rate_annual: Number(document.getElementById('lp-rate').value), min_amount: Number(document.getElementById('lp-min').value),
    max_amount: Number(document.getElementById('lp-max').value), tenure_months: Number(document.getElementById('lp-tenure').value),
    repayment_frequency: document.getElementById('lp-freq').value,
  };
  if(interestType === 'other'){
    payload.custom_interest_label = document.getElementById('lp-custom-label').value;
    payload.calculation_basis = document.getElementById('lp-calc-basis').value;
  }
  const isGroup = document.getElementById('lp-is-group').checked;
  if(isGroup){
    payload.is_group_loan = true;
    payload.group_member_count = Number(document.getElementById('lp-group-count').value);
    const penaltyType = document.getElementById('lp-penalty-type').value;
    if(penaltyType){
      payload.penalty_type = penaltyType;
      payload.penalty_amount = Number(document.getElementById('lp-penalty-amount').value);
    }
  }
  try{
    await api('/loan-products', { method:'POST', json: payload });
    renderLoanProducts();
  }catch(e){ errEl.textContent = e.message; }
}

function onApplyProductChange(){
  const sel = document.getElementById('la-product');
  if(!sel || !sel.options.length) return;
  const opt = sel.options[sel.selectedIndex];
  const isGroup = opt.dataset.group === 'true';
  document.getElementById('la-customer-field').classList.toggle('hidden', isGroup);
  document.getElementById('la-group-field').classList.toggle('hidden', !isGroup);
  const hint = `Allowed range: ₹${Number(opt.dataset.min).toLocaleString()} – ₹${Number(opt.dataset.max).toLocaleString()}`
    + (isGroup && opt.dataset.membercount ? ` · Requires a group of exactly ${opt.dataset.membercount} members` : '');
  document.getElementById('la-hint').textContent = hint;
}
async function applyForLoan(){
  const errEl = document.getElementById('la-err'); errEl.textContent = '';
  const branchId = state.role === 'superadmin' ? document.getElementById('la-branch').value : state.branch_id;
  if(!branchId){ errEl.textContent = 'Select a branch first.'; return; }
  const productSel = document.getElementById('la-product');
  const isGroup = productSel.options[productSel.selectedIndex].dataset.group === 'true';
  const productId = productSel.value;
  const amount = Number(document.getElementById('la-amount').value);
  const payload = { branch_id: branchId, loan_product_id: productId, principal_amount: amount };
  if(isGroup){
    const groupId = document.getElementById('la-group').value;
    if(!groupId || !productId || !amount){ errEl.textContent = 'Fill in every field.'; return; }
    payload.group_id = groupId;
  } else {
    const customerId = document.getElementById('la-customer').value;
    if(!customerId || !productId || !amount){ errEl.textContent = 'Fill in every field.'; return; }
    payload.customer_id = customerId;
  }
  try{
    const res = await api('/loans/apply', { method:'POST', json: payload });
    document.getElementById('la-result').innerHTML = `<div class="success-box">Loan application submitted — ${esc(res.loan_number)}. Waiting on SuperAdmin approval.</div>`;
    document.getElementById('la-amount').value = '';
    renderLoans();
  }catch(e){ errEl.textContent = e.message; }
}
async function approveLoan(id){ await api(`/loans/${id}/approve`, {method:'PATCH'}); renderLoans(); }
let rejectingLoanId = null;
function rejectLoan(id){
  rejectingLoanId = id;
  document.getElementById('reject-reason').value = '';
  document.getElementById('reject-loan-err').textContent = '';
  document.getElementById('reject-loan-modal').classList.add('show');
}
async function submitRejectLoan(){
  const reason = document.getElementById('reject-reason').value.trim();
  const errEl = document.getElementById('reject-loan-err');
  if(!reason){ errEl.textContent = 'A reason is required.'; return; }
  try{
    await api(`/loans/${rejectingLoanId}/reject`, { method:'PATCH', json:{ reason } });
    document.getElementById('reject-loan-modal').classList.remove('show');
    renderLoans();
  }catch(e){ errEl.textContent = e.message; }
}
let disbursingLoanId = null;
let disbursingCustomerId = null;
async function openDisburseModal(loanId, customerId){
  disbursingLoanId = loanId;
  disbursingCustomerId = customerId;
  document.getElementById('disburse-method').value = 'cash';
  document.getElementById('disburse-reference').value = '';
  document.getElementById('disburse-err').textContent = '';
  toggleDisburseReference();
  document.getElementById('disburse-loan-modal').classList.add('show');
}
async function toggleDisburseReference(){
  const isBank = document.getElementById('disburse-method').value === 'bank_transfer';
  document.getElementById('disburse-reference-field').classList.toggle('hidden', !isBank);
  const warningEl = document.getElementById('disburse-bank-warning');
  warningEl.classList.add('hidden');
  if(isBank){
    try{
      const customers = await api('/customers');
      const customer = customers.find(c => c.id === disbursingCustomerId);
      if(!customer || !customer.bank_account_number){
        warningEl.textContent = 'This customer has no bank account details on file. Add them from the Customers tab, or choose Cash instead.';
        warningEl.classList.remove('hidden');
      }
    }catch(e){}
  }
}
async function submitDisburse(){
  const method = document.getElementById('disburse-method').value;
  const reference = document.getElementById('disburse-reference').value;
  const errEl = document.getElementById('disburse-err'); errEl.textContent = '';
  try{
    await api(`/loans/${disbursingLoanId}/disburse`, { method:'PATCH', json:{
      disbursal_method: method, disbursal_reference: reference || null,
    }});
    document.getElementById('disburse-loan-modal').classList.remove('show');
    renderLoans();
  }catch(e){ errEl.textContent = e.message; }
}

// Shared authenticated-file-download helper — a plain <a href> can't carry the
// Bearer token, so every protected file download (receipts, KYC docs, reports)
// goes through this instead: fetch with the auth header, then trigger a
// synthetic download from the resulting blob.
async function downloadAuthenticatedFile(path, fallbackFilename){
  const res = await fetch(API + path, { headers: { 'Authorization': `Bearer ${state.token}` } });
  if(!res.ok){ const data = await res.json().catch(()=>({})); throw new Error(data.detail || 'Could not download this file.'); }
  const blob = await res.blob();
  const disposition = res.headers.get('Content-Disposition') || '';
  const match = disposition.match(/filename="?([^"]+)"?/);
  const filename = match ? match[1] : fallbackFilename;
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  window.URL.revokeObjectURL(url);
}

async function uploadKycDoc(customerId, docType){
  const fileInput = document.getElementById(`kyc-${docType}-${customerId}`);

  if(!fileInput.files.length){ statusEl.textContent = 'Choose a file first'; statusEl.style.color = '#C0392B'; return; }

  const formData = new FormData();
  formData.append('doc_type', docType);
  formData.append('customer_id', customerId);
  formData.append('file', fileInput.files[0]);
  try{
    const res = await fetch(API + '/documents/upload', {
      method: 'POST', headers: { 'Authorization': `Bearer ${state.token}` }, body: formData,
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || 'Upload failed');
    statusEl.textContent = '✓ Uploaded'; statusEl.style.color = '#5A6B00';

    <div class="panel"><h3>Record a collection</h3>
      <div class="form-grid">
        <div class="field"><label>Loan</label><select id="p-loan" onchange="onCollectionLoanChange()">${opts || '<option>No active loans</option>'}</select></div>
      </div>
      <div id="individual-collection-fields">
        <div class="form-grid">
          <div class="field"><label>Installment</label><select id="p-emi" onchange="updateCollectionAmount()"></select></div>
          <div class="field"><label>Amount (₹)</label><input id="p-amount" type="number" readonly style="background:#F6F5F2;cursor:not-allowed"><div style="font-size:11px;color:#888;margin-top:4px">Auto-filled from the selected installment's remaining due — must match exactly, so it isn't editable.</div></div>
        </div>
        <div class="row-actions">
          <button class="btn amber" onclick="collectCash()">Record cash payment</button>
          <button class="btn" onclick="collectRazorpay()">Collect via Razorpay</button>
        </div>
        <div class="err" id="p-err"></div>
        <div id="p-receipt"></div>
      </div>
      <div id="group-collection-fields" class="hidden">
        <div class="form-grid">
          <div class="field"><label>Installment</label><select id="pg-emi" onchange="loadGroupInstallmentStatus()"></select></div>
        </div>
        <div id="group-status-body"></div>
      </div>
    </div>
  `;
  if(loans.length) onCollectionLoanChange();
}
async function onCollectionLoanChange(){
  const sel = document.getElementById('p-loan');
  const isGroup = sel.options.length && sel.options[sel.selectedIndex].dataset.group === 'true';
  document.getElementById('individual-collection-fields').classList.toggle('hidden', isGroup);
  document.getElementById('group-collection-fields').classList.toggle('hidden', !isGroup);
  if(isGroup) await loadGroupInstallmentOptions();
  else await loadSchedule();
}
async function loadGroupInstallmentOptions(){
  const loanId = document.getElementById('p-loan').value;
  const sched = await api(`/loans/${loanId}/schedule`);
  document.getElementById('pg-emi').innerHTML = sched.map(s=>
    `<option value="${s.id}" ${s.is_paid?'':'selected'}>#${s.installment_no} — due ${s.due_date} — ${s.paid_count}/${s.total_members} paid ${s.is_paid?'✅':''}</option>`
  ).join('');
  await loadGroupInstallmentStatus();
}
async function loadGroupInstallmentStatus(){
  const loanId = document.getElementById('p-loan').value;
  const emiId = document.getElementById('pg-emi').value;
  const bodyEl = document.getElementById('group-status-body');
  if(!emiId){ bodyEl.innerHTML = ''; return; }
  bodyEl.innerHTML = '<div class="empty">Loading…</div>';
  try{
    const status = await api(`/payments/group-status/${loanId}/${emiId}`);
    bodyEl.innerHTML = `
      <div class="stat-card" style="margin:14px 0;display:inline-block;${status.is_fully_paid?'':'border-color:#C0392B'}">
        <div class="label">Group Status</div>
        <div class="value" style="font-size:18px;color:${status.is_fully_paid?'#5A6B00':'#C0392B'}">${status.is_fully_paid?'✅ Fully Paid':`⚠ ${status.unpaid_count} of ${status.total_members} yet to pay`}</div>
      </div>
      <table><thead><tr><th>Member</th><th>Status</th><th>Action</th><th>Expected</th><th>Penalty</th></tr></thead>
      <tbody>${status.members.map(m=>`<tr style="${m.is_paid?'':'background:#FBE4E1'}">
        <td>${esc(m.customer_name)}</td>
        <td>${m.is_paid?'<span class="badge active">Paid</span>':'<span class="badge pending_approval">Not Paid</span>'}</td>
        <td>${m.is_paid?'—':`<button class="btn amber" style="padding:6px 10px;font-size:12px" onclick="collectGroupMemberPayment('${m.group_member_id}',${m.expected_amount},${m.penalty_amount})">Collect</button>`}</td>
        <td>₹${m.expected_amount.toLocaleString()}</td>
        <td>${m.penalty_amount>0?`<span style="color:#C0392B">+₹${m.penalty_amount.toLocaleString()}</span>`:'—'}</td>
      </tr>`).join('')}</tbody></table>
      <p style="font-size:11px;color:#888;margin-top:6px">Swipe the table left to see the exact amount and any late penalty.</p>
      <div class="err" id="pg-err" style="margin-top:10px"></div>
      <div id="pg-receipt"></div>
    `;
  }catch(e){
    bodyEl.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}
async function collectGroupMemberPayment(groupMemberId, expected, penalty){
  const errEl = document.getElementById('pg-err'); errEl.textContent = '';
  const total = (expected + penalty).toFixed(2);
  if(!confirm(`Collect ₹${total} from this member${penalty>0?` (includes ₹${penalty.toLocaleString()} late penalty)`:''}?`)) return;
  try{
    const res = await api('/payments/group-cash', { method:'POST', json:{
      loan_id: document.getElementById('p-loan').value,
      emi_id: document.getElementById('pg-emi').value,
      group_member_id: groupMemberId, amount: Number(total),
    }});
    document.getElementById('pg-receipt').innerHTML = `<p style="margin-top:12px;font-size:13.5px">✅ Recorded — ${res.receipt_number}. <button class="link-btn" onclick="downloadReceipt('${res.payment_id}','${res.receipt_number}')">Print / download receipt</button></p>`;
    await loadGroupInstallmentOptions();
  }catch(e){ errEl.textContent = e.message; }
}
async function loadSchedule(){
  const loanId = document.getElementById('p-loan').value;
  if(!loanId) return;
  const sched = await api(`/loans/${loanId}/schedule`);
  document.getElementById('p-emi').innerHTML = sched.filter(s=>!s.is_paid).map(s=>
    `<option value="${s.id}" data-due="${(s.total_due - (s.amount_paid||0)).toFixed(2)}">#${s.installment_no} — due ${s.due_date} — ₹${(s.total_due - (s.amount_paid||0)).toFixed(2)}</option>`
  ).join('') || '<option value="">All installments paid</option>';
  updateCollectionAmount();
}
function updateCollectionAmount(){
  const sel = document.getElementById('p-emi');
  const amountEl = document.getElementById('p-amount');
  if(!sel || !sel.options.length || !sel.value){ if(amountEl) amountEl.value = ''; return; }
  amountEl.value = sel.options[sel.selectedIndex].dataset.due || '';
}
async function collectCash(){
  const errEl = document.getElementById('p-err'); errEl.textContent='';
  try{
    const res = await api('/payments/cash', { method:'POST', json:{
      loan_id: document.getElementById('p-loan').value, emi_id: document.getElementById('p-emi').value,
      amount: Number(document.getElementById('p-amount').value),
    }});
    document.getElementById('p-receipt').innerHTML = `<p style="margin-top:12px;font-size:13.5px">✅ Recorded — ${res.receipt_number}. <button class="link-btn" onclick="downloadReceipt('${res.payment_id}','${res.receipt_number}')">Print / download receipt</button></p>`;
  }catch(e){ errEl.textContent = e.message; }
}
async function collectRazorpay(){
  const errEl = document.getElementById('p-err'); errEl.textContent='';
  const loanId = document.getElementById('p-loan').value;
  const emiId = document.getElementById('p-emi').value;
  const amount = Number(document.getElementById('p-amount').value);
  try{
    const order = await api('/payments/razorpay/create-order', { method:'POST', json:{ loan_id: loanId, emi_id: emiId, amount }});
    if(typeof Razorpay === 'undefined'){ errEl.textContent = 'Razorpay checkout script not loaded.'; return; }
    const rzp = new Razorpay({
      key: order.key_id, amount: order.amount, currency: order.currency, order_id: order.order_id,
      name: 'OS Finances', description: 'Loan repayment',
      handler: async function(response){
        const res = await api('/payments/razorpay/verify', { method:'POST', json:{
          razorpay_order_id: response.razorpay_order_id, razorpay_payment_id: response.razorpay_payment_id,
          razorpay_signature: response.razorpay_signature, loan_id: loanId, emi_id: emiId, amount,
        }});
        document.getElementById('p-receipt').innerHTML = `<p style="margin-top:12px;font-size:13.5px">✅ Paid online — ${res.receipt_number}. <button class="link-btn" onclick="downloadReceipt('${res.payment_id}','${res.receipt_number}')">Print / download receipt</button></p>`;
      },
    });
    rzp.open();
  }catch(e){ errEl.textContent = e.message; }
}

// ---------- PWA registration ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}

// ---------- PWA install prompt (persistent, user-controlled) ----------
// Chrome's own install banner shows once and vanishes within seconds — this
// captures that same event instead and offers install via a button that stays
// available in the topbar until the user actually acts on it or dismisses it.
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('install-app-btn');
  if(btn) btn.classList.remove('hidden');
});
async function installApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  const btn = document.getElementById('install-app-btn');
  if(btn) btn.classList.add('hidden');
}
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  const btn = document.getElementById('install-app-btn');
  if(btn) btn.classList.add('hidden');
});

// Runs dead last, after every function/const above is defined — restoreSession
// calls enterApp/navigate, which touch NAV, content(), and other consts
// declared throughout this file, so this cannot run any earlier.
(function restoreSession(){
  const s = sessionStorage.getItem('osf_session');
  if(s){ state = JSON.parse(s); enterApp(); }
})();
</script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
